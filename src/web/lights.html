
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christmas Lights Control</title>

  <!-- Inline CSS for styling -->
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .status {
      margin: 15px 0;
      font-size: 1.5rem;
      color: #007bff;
      font-weight: bold;
    }

    .table {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .cell {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 15px 20px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.3s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover {
      background-color: #0056b3;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
    }

    button:active {
      transform: scale(0.95);
    }

    button i {
      margin-right: 12px;
      font-size: 20px;
    }

    @media (max-width: 600px) {
      .table {
        grid-template-columns: 1fr;
      }
    }

    .lights {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: #ddd;
      margin: 20px auto;
      animation: glow 3s infinite alternate ease-in-out;
      opacity: 0.1;
    }

    .lights.on {
      opacity: 1;
      animation: glow 1s infinite alternate ease-in-out;
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 8px #ddd;
      }
      to {
        box-shadow: 0 0 25px #ff0, 0 0 35px #f00, 0 0 45px #00f;
      }
    }

    .lights.off {
      opacity: 0.1;
    }

    .status {
      font-size: 1.4rem;
      color: #333;
      font-weight: 500;
    }

    .status.success {
      color: #28a745;
    }

    .status.error {
      color: #dc3545;
    }
  </style>
</head>
<body>
  <h1>Christmas Lights Control</h1>
  <div class="lights"></div>
  <div class="status">Status: Waiting for Action...</div>

  <div class="table">
    <div class="cell"><button onclick="blinkCoolAll()"><i>❄️</i>Cool Blink</button></div>
    <div class="cell"><button onclick="blinkCoolOne()"><i>❄️</i>Cool Blink Seq</button></div>
    <div class="cell"><button onclick="stayCool()"><i>❄️</i>Cool Stay</button></div>

    <div class="cell"><button onclick="blinkWarmAll()"><i>🔥</i>Warm Blink</button></div>
    <div class="cell"><button onclick="blinkWarmOne()"><i>🔥</i>Warm Blink Seq</button></div>
    <div class="cell"><button onclick="stayWarm()"><i>🔥</i>Warm Stay</button></div>

    <div class="cell"><button onclick="blinkAll()"><i>💡</i>Mix Blink</button></div>
    <div class="cell"><button onclick="blinkOne()"><i>💡</i>Mix Blink Seq</button></div>
    <div class="cell"><button onclick="stayAll()"><i>💡</i>Mix Stay</button></div>

    <div class="cell"><button onclick="stop()"><i>⛔</i>Stop All</button></div>
    <div class="cell"></div>
    <div class="cell"><button onclick="mix()"><i>🔀</i>Mix All</button></div>
  </div>

  <script>
    function sendRequest(endpoint, action) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', endpoint, true);
      xhr.send();

      updateStatus(action, 'success');
    }

    function updateStatus(message, type = '') {
      const statusElement = document.querySelector('.status');
      statusElement.textContent = message;
      statusElement.className = 'status ' + type;
    }

    function toggleLight(isOn) {
      const light = document.querySelector('.lights');
      if (isOn) {
        light.classList.add('on');
        light.classList.remove('off');
      } else {
        light.classList.remove('on');
        light.classList.add('off');
      }
    }

    function stop() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET',"http://192.168.1.151:3000/christmaslight/stop/", true)
      updateStatus("All Lights Turned Off", 'error');
      xhr.send();
      toggleLight(false);
    }

    function blinkCoolAll() { sendRequest("http://192.168.1.151:3000/christmaslight/coolall/", "Cool Blink All"); toggleLight(true); }
    function blinkCoolOne() { sendRequest("http://192.168.1.151:3000/christmaslight/coolone/", "Cool Blink Sequence"); toggleLight(true); }
    function blinkWarmAll() { sendRequest("http://192.168.1.151:3000/christmaslight/warmall/", "Warm Blink All"); toggleLight(true); }
    function blinkWarmOne() { sendRequest("http://192.168.1.151:3000/christmaslight/warmone/", "Warm Blink Sequence"); toggleLight(true); }
    function blinkAll() { sendRequest("http://192.168.1.151:3000/christmaslight/blinkall/", "Mix Blink All"); toggleLight(true); }
    function blinkOne() { sendRequest("http://192.168.1.151:3000/christmaslight/blinkone/", "Mix Blink Sequence"); toggleLight(true); }
    function mix() { sendRequest("http://192.168.1.151:3000/christmaslight/random/", "Mix All Lights"); toggleLight(true); }
    function stayCool() { sendRequest("http://192.168.1.151:3000/christmaslight/staycool/", "Cool Lights Stay"); toggleLight(true); }
    function stayWarm() { sendRequest("http://192.168.1.151:3000/christmaslight/staywarm/", "Warm Lights Stay"); toggleLight(true); }
    function stayAll() { sendRequest("http://192.168.1.151:3000/christmaslight/stayall/", "All Lights Stay"); toggleLight(true); }
  </script>
</body>
</html>
